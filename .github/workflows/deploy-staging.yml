name: 🚀 Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: 🚀 Deploy to staging.zfront.app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cloudflare
      url: https://staging.zfront.app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci
      - run: scripts/build-static-site.sh
        env:
          GAME_ENV: staging
          DOMAIN: zfront.app
      - name: Deploy
        # Skipped, not failed, until the Cloudflare secrets are set. The
        # wrangler version must be older than .npmrc's min-release-age (7
        # days) or npx refuses it.
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set; skipping deploy."
            exit 0
          fi
          npx --yes wrangler@4.151.1 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
