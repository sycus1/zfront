<!doctype html>
<html lang="en" class="h-full preload" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title data-i18n="main.title">zFront (ALPHA)</title>
    <link rel="manifest" href="<%- manifestHref %>" />
    <link rel="icon" type="image/svg+xml" href="<%- faviconHref %>" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#111111" />

    <!-- Preload styles -->
    <style>
      html {
        color-scheme: dark;
      }

      html.preload {
        visibility: visible !important;
        opacity: 1 !important;
        background-color: #111111 !important;
      }

      html.preload body {
        visibility: hidden;
        opacity: 0;
      }

      .preload {
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.5s ease-out;
      }

      /* iOS safe area support */
      body {
        padding-top: env(safe-area-inset-top);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
      }

      /* Ensure full viewport height on iOS; body grows with content so the
         document scrolls (see styles.css) */
      html {
        height: 100%;
        height: -webkit-fill-available;
      }
      body {
        min-height: 100%;
        min-height: -webkit-fill-available;
      }

      /* Disable iOS double-tap "smart zoom" on the page; the game has its
         own map zoom. Panning/scrolling stays allowed. See issue #4609. */
      html,
      body {
        touch-action: manipulation;
      }
    </style>

    <!-- SEO -->
    <link rel="canonical" href="https://zfront.app/" />
    <meta
      name="description"
      content="Build a base, hold the line and survive the zombie horde in this multiplayer tower-defence game."
    />

    <!-- Open Graph -->
    <meta property="og:url" content="https://zfront.app/" />
    <meta
      property="og:title"
      content="zFront - Base Builder vs Zombie Hordes"
    />
    <meta
      property="og:description"
      content="Build a base, hold the line and survive the zombie horde in this multiplayer tower-defence game."
    />
    <meta property="og:image" content="<%- gameplayScreenshotUrl %>" />
    <meta property="og:type" content="game" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "zFront",
        "url": "https://zfront.app/",
        "description": "Build a base, hold the line and survive the zombie horde in this multiplayer tower-defence game.",
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "gamePlatform": ["Web Browser", "PC", "Mobile"],
        "genre": ["Strategy", "Tower Defense", "Multiplayer"],
        "playMode": "MultiPlayer",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "sameAs": ["https://github.com/sycus1/zfront"]
      }
    </script>

    <!--
      Injected from Server env.

      Every per-server value (cluster, instanceLetter, instanceId, serverHost,
      siteHost) is emitted through a guard so the whole line — indentation and
      trailing comma included — disappears when the renderer does not supply
      it. That is what lets one page be rendered per VERSION rather than per
      server and uploaded to the CDN (docs/MultiServer.md, "Publish pipeline
      (v2)"); a game server supplies them all and gets exactly the page it
      always served.

      Never add a placeholder the Steam shell does not supply: openfront-desktop
      renders this same template itself and a missing local is a ReferenceError,
      i.e. a blank window. Guarding an existing one is safe — the shell supplies
      a value and the line still emits.
    -->
    <script>
      window.BOOTSTRAP_CONFIG = {
        gitCommit: <%- gitCommit %>,
        assetManifest: <%- assetManifest %>,
        cdnBase: <%- cdnBase %>,
        gameEnv: <%- gameEnv %>,<%- typeof cluster !== "undefined" && cluster ? "\n        cluster: " + cluster + "," : "" %><%- typeof instanceLetter !== "undefined" && instanceLetter ? "\n        instanceLetter: " + instanceLetter + "," : "" %>
        turnstileSiteKey: <%- turnstileSiteKey %>,
        jwtAudience: <%- jwtAudience %>,<%- typeof faroCollectorUrl !== "undefined" && faroCollectorUrl ? "\n        faroCollectorUrl: " + faroCollectorUrl + "," : "" %><%- typeof instanceId !== "undefined" && instanceId ? "\n        instanceId: " + instanceId + "," : "" %><%- typeof serverHost !== "undefined" && serverHost ? "\n        serverHost: " + serverHost + "," : "" %><%- typeof siteHost !== "undefined" && siteHost ? "\n        siteHost: " + siteHost + "," : "" %>
      };
      // Set here rather than from the bundle so the first paint already has the
      // desktop layout. The shell's preload defines openfrontDesktop before
      // any page script runs. ?desktop-layout previews it outside prod.
      if (
        window.openfrontDesktop ||
        (window.BOOTSTRAP_CONFIG.gameEnv !== "prod" &&
          new URLSearchParams(location.search).has("desktop-layout"))
      ) {
        document.documentElement.classList.add("desktop-shell");
      }
    </script>
  </head>

  <body
    class="select-none font-sans min-h-screen bg-zf-ink-900 transition-opacity duration-300 ease-in-out flex flex-row flex-wrap content-start"
  >
    <!-- The main menu's live feed (Night Shift). Hidden, and so paused,
         during a match. -->
    <zf-live-feed
      class="fixed inset-0 -z-50 in-[.in-game]:hidden"
    ></zf-live-feed>

    <!-- MAIN CONTENT AREA -->
    <div
      class="in-[.in-game]:hidden flex-1 basis-full min-w-0 min-h-dvh in-[.page-open]:min-h-0 in-[.page-open]:overflow-hidden relative pt-[var(--top-ad-pad,0px)] in-[.page-open]:pt-[var(--top-ad-height,0px)] transition-[margin] duration-500 ease-out will-change-[margin-left] flex flex-col"
    >
      <!-- Main container with responsive padding -->
      <play-page class="contents"></play-page>
      <!-- Night Shift pages: full width, with their own backdrop. -->
      <single-player-modal
        id="page-single-player"
        inline
        class="hidden flex-1 min-h-0 w-full page-content relative z-50 [&.block]:flex [&.block]:flex-col"
      ></single-player-modal>
      <user-setting
        id="page-settings"
        inline
        class="hidden flex-1 min-h-0 w-full page-content relative z-50 [&.block]:flex [&.block]:flex-col"
      ></user-setting>
      <troubleshooting-modal
        id="page-troubleshooting"
        inline
        class="hidden flex-1 min-h-0 w-full page-content relative z-50 [&.block]:flex [&.block]:flex-col"
      ></troubleshooting-modal>
      <help-modal
        id="page-help"
        inline
        class="hidden flex-1 min-h-0 w-full page-content relative z-50 [&.block]:flex [&.block]:flex-col"
      ></help-modal>
      <language-modal
        id="page-language"
        inline
        class="hidden flex-1 min-h-0 w-full page-content relative z-50 [&.block]:flex [&.block]:flex-col"
      ></language-modal>

      <div class="[.in-game_&]:hidden mt-auto flex flex-col shrink-0">
        <page-footer></page-footer>
      </div>
    </div>

    <!-- Game components -->
    <div id="app"></div>

    <!-- Bottom HUD (Night Shift "A2 compact bar"). lg+: a 3-column grid with
         troops bottom left, the tutorial and build strip bottom centre, and
         events and the game controls bottom right (events move top right at
         xl). Below lg it is one column over a full-width build strip. The
         wave panel and gold box are fixed to the top by their components. -->
    <div
      class="zf-hud-bottom fixed bottom-0 left-0 w-full z-[200] flex flex-col gap-2 pointer-events-none lg:grid lg:grid-cols-[1fr_auto_1fr] lg:items-end lg:gap-4"
    >
      <div
        class="flex flex-col items-end gap-2 px-2 lg:px-0 lg:col-start-3 lg:row-start-1 lg:justify-self-end"
      >
        <chat-display class="pointer-events-auto"></chat-display>
        <events-display class="zf-events-dock"></events-display>
        <replay-panel class="pointer-events-auto"></replay-panel>
        <game-right-sidebar></game-right-sidebar>
      </div>
      <div
        class="flex flex-col lg:col-start-1 lg:row-start-1 lg:justify-self-start"
      >
        <control-panel></control-panel>
      </div>
      <div
        class="flex flex-col gap-2 lg:items-center lg:col-start-2 lg:row-start-1"
      >
        <attacks-display
          class="w-full lg:w-[500px] pointer-events-auto"
        ></attacks-display>
        <tutorial-panel
          class="hidden w-full lg:w-[500px] px-2 lg:px-0"
        ></tutorial-panel>
        <unit-display></unit-display>
      </div>
    </div>

    <!-- Game modals and overlays -->
    <emoji-table></emoji-table>
    <build-menu></build-menu>
    <win-modal></win-modal>
    <game-starting-modal></game-starting-modal>
    <settings-modal></settings-modal>
    <!-- The in-game settings modal: the same component as #page-settings, but
         non-inline, and mounted out here because the page's copy sits in a
         subtree that is hidden during a match. It must stay AFTER
         #page-settings in document order: ModalRouter.routeFromHash and
         Main.ts both resolve this component with
         document.querySelector("user-setting"), which takes the first match. -->
    <user-setting id="game-settings"></user-setting>
    <player-panel></player-panel>
    <spawn-timer></spawn-timer>
    <immunity-timer></immunity-timer>
    <horde-hud></horde-hud>
    <alert-frame></alert-frame>
    <chat-modal></chat-modal>
    <multi-tab-modal></multi-tab-modal>
    <game-left-sidebar></game-left-sidebar>
    <performance-overlay></performance-overlay>
    <player-info-overlay></player-info-overlay>
    <heads-up-message></heads-up-message>

    <!-- Scripts -->
    <script>
      // Remove preload class after everything is loaded
      window.addEventListener("load", function () {
        requestAnimationFrame(() => {
          document.documentElement.classList.remove("preload");
        });
      });

      // Fallback: remove preload class after timeout in case DOMContentLoaded never fires
      setTimeout(function () {
        document.documentElement.classList.remove("preload");
      }, 3000);
    </script>

    <script type="module" src="/src/client/Main.ts"></script>
  </body>
</html>
